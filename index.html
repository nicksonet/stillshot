<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Still Shot</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe3e8; font-family: system-ui, sans-serif; }
      #app canvas { display: block; }
      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: rgba(223, 227, 232, 0.86); color: #1a1a1a; text-align: center; z-index: 10;
      }
      #overlay.hidden { display: none; }
      #overlay h1 { margin: 0; font-size: 72px; font-style: italic; font-weight: 900; letter-spacing: 2px; color: #e8281c; }
      #overlay p { margin: 0; max-width: 560px; line-height: 1.5; color: #333; }
      #overlay .keys { font-size: 14px; color: #555; }
      #play-desktop {
        padding: 12px 28px; font-size: 16px; border: 1px solid #1a1a1a; background: #fff; color: #1a1a1a; cursor: pointer; border-radius: 4px;
      }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
        background: #e8281c; z-index: 5; display: none;
      }
      body.desktop #crosshair { display: block; }
      #VRButton { position: static !important; transform: none !important; left: auto !important; bottom: auto !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="overlay">
      <h1>STILL SHOT</h1>
      <p>Время движется, только когда движешься ты. Уклоняйся от пуль, стреляй, бросай пистолеты, бей рукой.</p>
      <div id="vr-slot"></div>
      <button id="play-desktop">Играть в браузере (мышь + клавиатура)</button>
      <p class="keys">WASD — движение · мышь — прицел · ЛКМ — выстрел · ПКМ — бросить пистолет · E — подобрать · F — удар · R — заново</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
