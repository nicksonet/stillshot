<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Still Shot</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a1c; font-family: system-ui, sans-serif; }
      #app canvas { display: block; }
      #overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 16px; box-sizing: border-box; text-align: center; z-index: 10; color: #d8faff;
        background: radial-gradient(ellipse at 50% 35%, rgba(255, 43, 214, 0.18), rgba(13, 10, 28, 0.92) 60%);
      }
      #overlay.hidden { display: none; }
      #overlay h1 {
        margin: 0; font-size: clamp(44px, 10vw, 84px); font-style: italic; font-weight: 900; letter-spacing: 3px; color: #fff;
        text-shadow: 0 0 6px #ff2bd6, 0 0 18px #ff2bd6, 0 0 42px #ff2bd6;
      }
      #overlay p { margin: 0; max-width: 580px; line-height: 1.5; }
      #overlay .keys { font-size: 14px; color: #8fb8d0; }
      #play-desktop, #VRButton {
        padding: 12px 28px !important; font-size: 16px !important; border: 1px solid #19f0ff !important; border-radius: 4px !important;
        background: rgba(25, 240, 255, 0.08) !important; color: #d8faff !important; cursor: pointer; opacity: 1 !important;
        box-shadow: 0 0 12px rgba(25, 240, 255, 0.45), inset 0 0 12px rgba(25, 240, 255, 0.15);
        font-family: system-ui, sans-serif !important; width: auto !important;
      }
      #VRButton { border-color: #ff2bd6 !important; box-shadow: 0 0 14px rgba(255, 43, 214, 0.6), inset 0 0 12px rgba(255, 43, 214, 0.2); }
      #VRButton { position: static !important; transform: none !important; left: auto !important; bottom: auto !important; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
        background: #19f0ff; box-shadow: 0 0 8px #19f0ff; z-index: 5; display: none;
      }
      body.desktop #crosshair { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="overlay">
      <h1>STILL SHOT</h1>
      <p>Time moves only when you move. Protect the boss, dodge bullets, take their guns — and don't hit the civilians.</p>
      <div id="vr-slot"></div>
      <button id="play-desktop">Play in browser (mouse + keyboard)</button>
      <p class="keys">WASD move · mouse aim · LMB shoot (hold for auto) · RMB throw · E grab / disarm · F punch · R restart</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
